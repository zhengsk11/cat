<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 孕猫体重管家</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #fdf6e3; color: #333; padding: 20px; max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; color: #d35400; font-size: 1.5rem; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 20px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #e67e22; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:active { background-color: #d35400; }
        ul { list-style-type: none; padding: 0; }
        li { background: #fff; border-bottom: 1px solid #eee; padding: 10px; display: flex; justify-content: space-between; }
        li:first-child { border-top-left-radius: 8px; border-top-right-radius: 8px; }
        li:last-child { border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; border-bottom: none; }
        .delete-btn { color: red; cursor: pointer; font-weight: bold; margin-left: 10px;}
    </style>
</head>
<body>

    <h1>🐱 孕猫体重管家</h1>

    <div class="card">
        <label>日期：</label>
        <input type="date" id="dateInput">
        
        <label>体重 (kg)：</label>
        <input type="number" id="weightInput" placeholder="例如：4.5" step="0.1">
        
        <button onclick="addRecord()">记录体重</button>
    </div>

    <div class="card">
        <h3>📋 历史记录</h3>
        <ul id="recordList">
            <!-- 记录会显示在这里 -->
        </ul>
        <p style="text-align:center; color:#888; font-size:12px; margin-top:10px;">数据保存在手机本地，清理缓存会丢失哦</p>
    </div>

    <script>
        // 初始化日期为今天
        document.getElementById('dateInput').valueAsDate = new Date();
        loadRecords();

        function addRecord() {
            const date = document.getElementById('dateInput').value;
            const weight = document.getElementById('weightInput').value;

            if (!date || !weight) {
                alert("请填写完整日期和体重哦！");
                return;
            }

            const record = { date, weight };
            
            // 获取旧数据
            let records = JSON.parse(localStorage.getItem('catWeightRecords')) || [];
            records.push(record);
            
            // 保存新数据
            localStorage.setItem('catWeightRecords', JSON.stringify(records));
            
            // 清空输入框并刷新列表
            document.getElementById('weightInput').value = '';
            loadRecords();
            alert("记录成功！猫咪辛苦啦~");
        }

        function loadRecords() {
            const list = document.getElementById('recordList');
            list.innerHTML = '';
            let records = JSON.parse(localStorage.getItem('catWeightRecords')) || [];

            // 倒序显示，最新的在前面
            records.reverse().forEach((rec, index) => {
                const li = document.createElement('li');
                // 计算原始索引以便删除
                const originalIndex = records.length - 1 - index; 
                
                li.innerHTML = `
                    <span>📅 ${rec.date} &nbsp; ⚖️ ${rec.weight} kg</span>
                    <span class="delete-btn" onclick="deleteRecord(${originalIndex})">×</span>
                `;
                list.appendChild(li);
            });
        }

        function deleteRecord(index) {
            if(confirm('确定要删除这条记录吗？')) {
                let records = JSON.parse(localStorage.getItem('catWeightRecords')) || [];
                records.splice(index, 1);
                localStorage.setItem('catWeightRecords', JSON.stringify(records));
                loadRecords();
            }
        }
    </script>
</body>
</html>
