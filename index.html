<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 孕猫体重管家</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #fdf6e3; color: #333; padding: 20px; max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; color: #d35400; font-size: 1.5rem; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; font-size: 0.9rem; margin-bottom: 20px; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 20px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #e67e22; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #d35400; }
        ul { list-style: none; padding: 0; }
        li { background: #fff8dc; border-bottom: 1px solid #eee; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        li:first-child { border-top-left-radius: 8px; border-top-right-radius: 8px; }
        li:last-child { border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; border-bottom: none; }
        .date { font-size: 0.85rem; color: #888; }
        .weight { font-weight: bold; color: #d35400; font-size: 1.1rem; }
        .delete-btn { background: none; border: none; color: #999; font-size: 1.2rem; cursor: pointer; width: auto; padding: 0 0 0 10px; }
        .empty-tip { text-align: center; color: #999; padding: 20px; }
        .countdown { text-align: center; padding: 15px; background: #f9f9f9; border-radius: 10px; margin-bottom: 15px; }
        .days { font-size: 2.2rem; font-weight: bold; color: #c0392b; }
        .stage-early { color: #27ae60; }
        .stage-mid { color: #2980b9; }
        .stage-late { color: #c0392b; }
        .progress-container { background: #ecf0f1; border-radius: 10px; height: 12px; margin: 10px 0; overflow: hidden; }
        .progress-bar { height: 100%; border-radius: 10px; background: linear-gradient(to right, #27ae60, #2980b9, #c0392b); }
        .warning { color: #e74c3c; font-weight: bold; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>🤰 孕猫体重管家</h1>
    <p class="subtitle">科学记录体重变化，守护孕期健康</p>

    <!-- 孕期设置 -->
    <div class="card">
        <label for="matingDate">配种日期</label>
        <input type="date" id="matingDate" onchange="saveMatingDate()">
        <div class="countdown" id="countdownDisplay">
            <div>预产期倒计时</div>
            <div class="days" id="daysCount">--</div>
            <div id="stageInfo">请设置配种日期</div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <!-- 体重记录 -->
    <div class="card">
        <label for="weightInput">今日体重 (kg)</label>
        <input type="number" id="weightInput" placeholder="例如：4.5" step="0.1">
        <button onclick="addRecord()">➕ 添加记录</button>
    </div>

    <!-- 记录列表 -->
    <div class="card">
        <h3 style="margin-top:0; color:#666;">📅 历史记录</h3>
        <ul id="recordList">
            <!-- 记录会显示在这里 -->
        </ul>
        <div id="emptyTip" class="empty-tip">还没有记录哦，快记一笔吧！</div>
    </div>

    <script>
        // 初始化数据
        let records = JSON.parse(localStorage.getItem('catWeightRecords')) || [];
        let matingDate = localStorage.getItem('matingDate') || '';
        
        // 页面加载时初始化
        window.onload = function() {
            document.getElementById('matingDate').value = matingDate;
            if (matingDate) updateCountdown();
            renderList();
        };

        // 保存配种日期
        function saveMatingDate() {
            matingDate = document.getElementById('matingDate').value;
            localStorage.setItem('matingDate', matingDate);
            updateCountdown();
        }

        // 更新倒计时
        function updateCountdown() {
            if (!matingDate) return;
            
            const mating = new Date(matingDate);
            const dueDate = new Date(mating);
            dueDate.setDate(mating.getDate() + 63); // 预产期=配种日+63天
            
            const today = new Date();
            today.setHours(0,0,0,0);
            
            const diffTime = dueDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            // 更新倒计时显示
            document.getElementById('daysCount').textContent = diffDays;
            
            // 孕期阶段判断
            let stageText, stageClass;
            const progress = Math.min(100, Math.max(0, ((63 - diffDays) / 63) * 100));
            document.getElementById('progressBar').style.width = `${progress}%`;
            
            if (diffDays > 35) {
                stageText = `孕早期（1-5周）胚胎发育关键期`;
                stageClass = 'stage-early';
            } else if (diffDays > 14) {
                stageText = `孕中期（6-8周）胎儿快速生长期`;
                stageClass = 'stage-mid';
            } else if (diffDays >= 0) {
                stageText = `孕晚期（9周+）准备分娩`;
                stageClass = 'stage-late';
            } else {
                stageText = `已超期 ${Math.abs(diffDays)} 天！建议立即就医检查`;
                stageClass = 'warning';
            }
            
            document.getElementById('stageInfo').innerHTML = `<span class="${stageClass}">${stageText}</span>`;
        }

        // 添加体重记录
        function addRecord() {
            const input = document.getElementById('weightInput');
            const weight = parseFloat(input.value);

            if (!weight || weight <= 0) {
                alert("请输入有效的体重数字哦！");
                return;
            }

            if (!matingDate) {
                alert("请先设置配种日期！");
                return;
            }

            const now = new Date();
            const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            records.unshift({ date: dateStr, weight: weight });
            localStorage.setItem('catWeightRecords', JSON.stringify(records));
            
            input.value = '';
            renderList();
        }

        // 删除记录
        function deleteRecord(index) {
            if(confirm('确定要删除这条记录吗？')) {
                records.splice(index, 1);
                localStorage.setItem('catWeightRecords', JSON.stringify(records));
                renderList();
            }
        }

        // 渲染列表
        function renderList() {
            const list = document.getElementById('recordList');
            const emptyTip = document.getElementById('emptyTip');
            list.innerHTML = '';

            if (records.length === 0) {
                emptyTip.style.display = 'block';
            } else {
                emptyTip.style.display = 'none';
                records.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <div>
                            <div class="weight">${item.weight} kg</div>
                            <div class="date">${item.date}</div>
                        </div>
                        <button class="delete-btn" onclick="deleteRecord(${index})">×</button>
                    `;
                    list.appendChild(li);
                });
            }
        }
    </script>
</body>
</html>
